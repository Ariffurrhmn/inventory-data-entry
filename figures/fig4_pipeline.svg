<svg viewBox="0 0 1150 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Detailed processing pipeline</title>
<desc>Stage-by-stage pipeline from captured image through OCR, document structure and type recognition, schema-constrained extraction, arithmetic self-validation with confidence scoring, to JSON response delivered via the digitization API. A record that fails the arithmetic check or falls below the confidence threshold is flagged review_required in the output but is still delivered — there is no human-in-the-loop routing.</desc>
<defs>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
</marker>
<marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
</marker>
<marker id="a4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
</marker>
</defs>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .stage { font-size: 13.5px; font-weight: 700; }
  .io { font-size: 10.5px; }
  .lbl { font-size: 11px; font-weight: 600; }
  .edge { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#a4); }
  .edge-g { stroke: #16a34a; stroke-width: 1.7; fill: none; marker-end: url(#a4g); }
  .edge-o { stroke: #ea580c; stroke-width: 1.7; fill: none; marker-end: url(#a4o); }
</style>
<rect width="1150" height="700" fill="#ffffff"/>
<text x="575" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Detailed Processing Pipeline: Module Inputs, Outputs, and Verification</text>

<!-- main chain: modules 3.4.1 - 3.4.4 -->
<rect x="30" y="70" width="185" height="86" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="122" y="94" text-anchor="middle" class="stage" fill="#713f12">3.4.1 Document Capture</text>
<text x="122" y="114" text-anchor="middle" class="io" fill="#854d0e">in: physical document</text>
<text x="122" y="130" text-anchor="middle" class="io" fill="#854d0e">out: image + idempotency</text>
<text x="122" y="145" text-anchor="middle" class="io" fill="#854d0e">key</text>

<rect x="240" y="70" width="185" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="332" y="94" text-anchor="middle" class="stage" fill="#1e3a8a">3.4.2 Character Recognition</text>
<text x="332" y="114" text-anchor="middle" class="io" fill="#1e40af">in: document image</text>
<text x="332" y="130" text-anchor="middle" class="io" fill="#1e40af">out: text tokens + bounding</text>
<text x="332" y="145" text-anchor="middle" class="io" fill="#1e40af">boxes + per-token confidence</text>

<rect x="455" y="70" width="235" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.6"/>
<text x="572" y="92" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">3.4.3 Structure &amp; Type Recognition</text>
<text x="572" y="114" text-anchor="middle" class="io" fill="#1e40af">in: text tokens + bounding boxes</text>
<text x="572" y="130" text-anchor="middle" class="io" fill="#1e40af">out: doc-type label + confidence,</text>
<text x="572" y="145" text-anchor="middle" class="io" fill="#1e40af">table/header/total regions</text>

<rect x="712" y="70" width="230" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="827" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">3.4.4 Schema-Constrained Extraction</text>
<text x="827" y="114" text-anchor="middle" class="io" fill="#1e40af">in: text, regions, doc type</text>
<text x="827" y="130" text-anchor="middle" class="io" fill="#1e40af">out: line-item records</text>
<text x="827" y="145" text-anchor="middle" class="io" fill="#1e40af">conforming to Table 3.4</text>

<path class="edge" d="M215,113 L240,113"/>
<path class="edge" d="M425,113 L455,113"/>
<path class="edge" d="M690,113 L720,113"/>

<!-- verification step -->
<rect x="727" y="205" width="200" height="90" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
<text x="827" y="230" text-anchor="middle" class="stage" fill="#14532d">Arithmetic Self-Validation</text>
<text x="827" y="248" text-anchor="middle" class="io" fill="#166534">qty × unit price = line total;</text>
<text x="827" y="264" text-anchor="middle" class="io" fill="#166534">line totals vs. grand total</text>
<text x="827" y="282" text-anchor="middle" class="io" fill="#166534">+ confidence scoring vs. threshold</text>
<path class="edge" d="M827,166 L827,205"/>

<!-- decision -->
<polygon points="827,335 927,382 827,429 727,382" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="827" y="378" text-anchor="middle" class="stage" fill="#7c2d12">Passes check</text>
<text x="827" y="395" text-anchor="middle" class="stage" fill="#7c2d12">&amp; above threshold?</text>
<path class="edge" d="M827,295 L827,335"/>

<!-- pass branch -->
<rect x="947" y="345" width="185" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="1039" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Included at full confidence</text>
<text x="1039" y="386" text-anchor="middle" class="io" fill="#166534">review_required: false</text>
<path class="edge-g" d="M927,368 L947,368"/>
<text x="925" y="352" class="lbl" fill="#16a34a">yes</text>

<!-- fail branch -->
<rect x="700" y="470" width="254" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="827" y="493" text-anchor="middle" class="stage" fill="#7c2d12">Flagged, still delivered</text>
<text x="827" y="511" text-anchor="middle" class="io" fill="#9a3412">review_required: true in JSON</text>
<text x="827" y="528" text-anchor="middle" class="io" fill="#9a3412" font-style="italic">no human-loop routing — a flag, not a queue</text>
<path class="edge-o" d="M827,429 L827,470"/>
<text x="839" y="452" class="lbl" fill="#ea580c">no</text>

<!-- both feed into JSON response -->
<rect x="880" y="600" width="220" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="990" y="624" text-anchor="middle" class="stage" fill="#1e3a8a">3.4.5 Digitization API</text>
<text x="990" y="642" text-anchor="middle" class="io" fill="#1e40af">out: standardized JSON (Table 3.4)</text>
<text x="990" y="657" text-anchor="middle" class="io" fill="#1e40af">idempotent submit + retrieval</text>

<path class="edge" d="M1039,417 L1039,635 L1100,635"/>
<path class="edge" d="M827,542 L827,635 L880,635"/>

<!-- data model note -->
<rect x="30" y="600" width="620" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="46" y="622" class="lbl" fill="#334155">3.4.6 Data Model (not a processing stage)</text>
<text x="46" y="641" class="io" fill="#475569">The Digitization API's only persistent state is the Submission record (submission_id, shop,</text>
<text x="46" y="657" class="io" fill="#475569">received_at, processing_status, result_json_ref) — enforces idempotency, holds no inventory state.</text>
<text x="46" y="673" class="io" fill="#475569">See Figure 7.</text>

</svg>
