<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Project timeline Gantt chart</title>
<desc>Six-phase development lifecycle mapped across CSE 498A and 498B, showing completed proposal-phase work and planned implementation work, with corpus collection marked as the critical-path dependency.</desc>
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="2.5"/>
</pattern>
<marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
</marker>
</defs>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .task { font-size: 11.5px; font-weight: 600; }
  .hdr { font-size: 12px; font-weight: 700; }
  .tick { font-size: 10.5px; }
  .note { font-size: 10.5px; }
  .dep { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#a9); }
</style>
<rect width="1120" height="600" fill="#ffffff"/>
<text x="560" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Project Timeline Across CSE 498A and 498B</text>

<!-- phase band headers -->
<rect x="330" y="48" width="290" height="26" rx="4" fill="#1e40af"/>
<text x="475" y="66" text-anchor="middle" class="hdr" fill="#ffffff">CSE 498A — Design Phase</text>
<rect x="628" y="48" width="452" height="26" rx="4" fill="#166534"/>
<text x="854" y="66" text-anchor="middle" class="hdr" fill="#ffffff">CSE 498B — Implementation Phase</text>

<!-- grid -->
<line x1="330" y1="80" x2="330" y2="500" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="620" y1="80" x2="620" y2="500" stroke="#334155" stroke-width="2"/>
<line x1="1080" y1="80" x2="1080" y2="500" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="404" y1="80" x2="404" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="478" y1="80" x2="478" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="552" y1="80" x2="552" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="712" y1="80" x2="712" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="804" y1="80" x2="804" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="896" y1="80" x2="896" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<line x1="988" y1="80" x2="988" y2="500" stroke="#e2e8f0" stroke-width="1"/>

<!-- rows -->
<text x="20" y="106" class="task" fill="#334155">1. Requirement analysis &amp; review</text>
<rect x="332" y="92" width="286" height="22" rx="4" fill="#3b82f6"/>
<text x="475" y="107" text-anchor="middle" class="note" fill="#ffffff">complete</text>

<text x="20" y="142" class="task" fill="#334155">2. Data model &amp; API contract design</text>
<rect x="404" y="128" width="214" height="22" rx="4" fill="#3b82f6"/>
<rect x="622" y="128" width="180" height="22" rx="4" fill="url(#hatch)" stroke="#64748b" stroke-width="1"/>
<text x="712" y="143" text-anchor="middle" class="note" fill="#334155">revised after corpus</text>

<text x="20" y="178" class="task" fill="#7f1d1d">3. Corpus collection &amp; annotation</text>
<rect x="622" y="164" width="212" height="22" rx="4" fill="#dc2626"/>
<text x="728" y="179" text-anchor="middle" class="note" fill="#ffffff">CRITICAL PATH</text>

<text x="20" y="214" class="task" fill="#334155">4. Recognition pipeline (few-shot)</text>
<rect x="622" y="200" width="180" height="22" rx="4" fill="#16a34a"/>
<text x="712" y="215" text-anchor="middle" class="note" fill="#ffffff">not blocked by corpus</text>

<text x="20" y="250" class="task" fill="#334155">4b. Classifier fine-tuning</text>
<rect x="850" y="236" width="138" height="22" rx="4" fill="#16a34a"/>
<text x="919" y="251" text-anchor="middle" class="note" fill="#ffffff">needs corpus</text>

<text x="20" y="286" class="task" fill="#334155">5. Standardization &amp; human loop</text>
<rect x="712" y="272" width="184" height="22" rx="4" fill="#16a34a"/>

<text x="20" y="322" class="task" fill="#334155">5b. Confidence-signal resolution</text>
<rect x="622" y="308" width="120" height="22" rx="4" fill="#ea580c"/>
<text x="682" y="323" text-anchor="middle" class="note" fill="#ffffff">Decision 4</text>

<text x="20" y="358" class="task" fill="#334155">6. Digitization API core</text>
<rect x="712" y="344" width="184" height="22" rx="4" fill="#16a34a"/>

<text x="20" y="394" class="task" fill="#334155">7. Evaluation &amp; benchmarking</text>
<rect x="896" y="380" width="184" height="22" rx="4" fill="#16a34a"/>
<text x="988" y="395" text-anchor="middle" class="note" fill="#ffffff">needs corpus + pipeline</text>

<text x="20" y="430" class="task" fill="#334155">8. Report writing</text>
<rect x="478" y="416" width="140" height="22" rx="4" fill="#3b82f6"/>
<rect x="988" y="416" width="92" height="22" rx="4" fill="#16a34a"/>

<!-- dependency arrows from corpus -->
<path class="dep" d="M834,186 L919,236"/>
<path class="dep" d="M834,186 C960,200 980,340 988,380"/>

<!-- axis label -->
<line x1="330" y1="500" x2="1080" y2="500" stroke="#334155" stroke-width="1.5"/>
<text x="475" y="518" text-anchor="middle" class="tick" fill="#475569">current semester</text>
<text x="854" y="518" text-anchor="middle" class="tick" fill="#475569">following semester</text>
<text x="620" y="536" text-anchor="middle" class="tick" fill="#334155" font-weight="700">▲ this report submitted here</text>

<!-- legend -->
<rect x="20" y="548" width="1060" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="36" y="560" width="22" height="14" rx="3" fill="#3b82f6"/>
<text x="64" y="571" class="note" fill="#334155">498A, complete</text>
<rect x="180" y="560" width="22" height="14" rx="3" fill="#16a34a"/>
<text x="208" y="571" class="note" fill="#334155">498B, planned</text>
<rect x="320" y="560" width="22" height="14" rx="3" fill="#dc2626"/>
<text x="348" y="571" class="note" fill="#334155">critical path</text>
<rect x="452" y="560" width="22" height="14" rx="3" fill="#ea580c"/>
<text x="480" y="571" class="note" fill="#334155">open decision to resolve</text>
<rect x="640" y="560" width="22" height="14" rx="3" fill="url(#hatch)" stroke="#64748b" stroke-width="1"/>
<text x="668" y="571" class="note" fill="#334155">revisited in a later iteration</text>
<line x1="850" y1="567" x2="880" y2="567" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="888" y="571" class="note" fill="#334155">dependency on corpus availability</text>
</svg>
