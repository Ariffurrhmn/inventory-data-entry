<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Document-type taxonomy</title>
<desc>Four target document classes — purchase order, delivery note, customer copy, and receipt — each with the structural and lexical cues that distinguish it and its implication for inventory.</desc>
<defs>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
</marker>
</defs>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .cls { font-size: 14px; font-weight: 700; }
  .hd { font-size: 11px; font-weight: 700; }
  .cue { font-size: 10.5px; }
  .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a5); }
</style>
<rect width="1120" height="620" fill="#ffffff"/>
<text x="560" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Document-Type Taxonomy and Distinguishing Cues</text>

<!-- root -->
<rect x="440" y="55" width="240" height="52" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="560" y="79" text-anchor="middle" class="cls" fill="#1e293b">Captured Supplier Document</text>
<text x="560" y="96" text-anchor="middle" class="cue" fill="#475569">classified into exactly one class</text>

<path class="edge" d="M480,107 L200,150"/>
<path class="edge" d="M530,107 L455,150"/>
<path class="edge" d="M590,107 L665,150"/>
<path class="edge" d="M640,107 L920,150"/>

<!-- 1 Purchase Order -->
<rect x="30" y="150" width="235" height="290" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<rect x="30" y="150" width="235" height="34" rx="9" fill="#2563eb"/>
<text x="147" y="173" text-anchor="middle" class="cls" fill="#ffffff">Purchase Order</text>
<text x="45" y="205" class="hd" fill="#1e3a8a">Structural cues</text>
<text x="45" y="223" class="cue" fill="#1e40af">• Line-item table present</text>
<text x="45" y="240" class="cue" fill="#1e40af">• Quantity + unit price columns</text>
<text x="45" y="257" class="cue" fill="#1e40af">• Grand total block</text>
<text x="45" y="274" class="cue" fill="#1e40af">• Supplier letterhead</text>
<text x="45" y="302" class="hd" fill="#1e3a8a">Lexical cues</text>
<text x="45" y="320" class="cue" fill="#1e40af">"Purchase Order", "P.O. No."</text>
<text x="45" y="337" class="cue" fill="#1e40af">"Order Date", "Ship To"</text>
<text x="45" y="365" class="hd" fill="#1e3a8a">Inventory implication</text>
<text x="45" y="383" class="cue" fill="#1e40af">Goods ordered — stock</text>
<text x="45" y="400" class="cue" fill="#1e40af">expected, not yet received</text>
<rect x="40" y="410" width="215" height="22" rx="4" fill="#dbeafe"/>
<text x="147" y="425" text-anchor="middle" class="cue" fill="#1e3a8a">Full line items extracted</text>

<!-- 2 Delivery Note -->
<rect x="285" y="150" width="235" height="290" rx="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
<rect x="285" y="150" width="235" height="34" rx="9" fill="#16a34a"/>
<text x="402" y="173" text-anchor="middle" class="cls" fill="#ffffff">Delivery Note</text>
<text x="300" y="205" class="hd" fill="#14532d">Structural cues</text>
<text x="300" y="223" class="cue" fill="#166534">• Line-item table present</text>
<text x="300" y="240" class="cue" fill="#166534">• Quantity column</text>
<text x="300" y="257" class="cue" fill="#166534">• Prices often absent</text>
<text x="300" y="274" class="cue" fill="#166534">• Signature / receipt block</text>
<text x="300" y="302" class="hd" fill="#14532d">Lexical cues</text>
<text x="300" y="320" class="cue" fill="#166534">"Delivery Note", "Challan"</text>
<text x="300" y="337" class="cue" fill="#166534">"Received By", "Dispatch"</text>
<text x="300" y="365" class="hd" fill="#14532d">Inventory implication</text>
<text x="300" y="383" class="cue" fill="#166534">Goods physically received —</text>
<text x="300" y="400" class="cue" fill="#166534">stock increase</text>
<rect x="295" y="410" width="215" height="22" rx="4" fill="#dcfce7"/>
<text x="402" y="425" text-anchor="middle" class="cue" fill="#14532d">Quantities are authoritative</text>

<!-- 3 Customer Copy -->
<rect x="540" y="150" width="235" height="290" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<rect x="540" y="150" width="235" height="34" rx="9" fill="#ca8a04"/>
<text x="657" y="173" text-anchor="middle" class="cls" fill="#ffffff">Customer Copy</text>
<text x="555" y="205" class="hd" fill="#713f12">Structural cues</text>
<text x="555" y="223" class="cue" fill="#854d0e">• Mirrors an invoice layout</text>
<text x="555" y="240" class="cue" fill="#854d0e">• Explicit copy marking</text>
<text x="555" y="257" class="cue" fill="#854d0e">• Often duplicate of a</text>
<text x="555" y="274" class="cue" fill="#854d0e">&#160;&#160;document already seen</text>
<text x="555" y="302" class="hd" fill="#713f12">Lexical cues</text>
<text x="555" y="320" class="cue" fill="#854d0e">"Customer Copy", "Duplicate"</text>
<text x="555" y="337" class="cue" fill="#854d0e">"Office Copy", "Not for Payment"</text>
<text x="555" y="365" class="hd" fill="#713f12">Inventory implication</text>
<text x="555" y="383" class="cue" fill="#854d0e">Record of a transaction —</text>
<text x="555" y="400" class="cue" fill="#854d0e">must NOT double-count</text>
<rect x="550" y="410" width="215" height="22" rx="4" fill="#fef9c3"/>
<text x="657" y="425" text-anchor="middle" class="cue" fill="#713f12">Highest duplication risk</text>

<!-- 4 Receipt -->
<rect x="795" y="150" width="235" height="290" rx="9" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
<rect x="795" y="150" width="235" height="34" rx="9" fill="#be185d"/>
<text x="912" y="173" text-anchor="middle" class="cls" fill="#ffffff">Receipt</text>
<text x="810" y="205" class="hd" fill="#831843">Structural cues</text>
<text x="810" y="223" class="cue" fill="#9d174d">• Narrow, single-column</text>
<text x="810" y="240" class="cue" fill="#9d174d">• Thermal print artifacts</text>
<text x="810" y="257" class="cue" fill="#9d174d">• Compressed item lines</text>
<text x="810" y="274" class="cue" fill="#9d174d">• Total + payment block</text>
<text x="810" y="302" class="hd" fill="#831843">Lexical cues</text>
<text x="810" y="320" class="cue" fill="#9d174d">"Receipt", "Cash Memo"</text>
<text x="810" y="337" class="cue" fill="#9d174d">"Paid", "Change", "Thank You"</text>
<text x="810" y="365" class="hd" fill="#831843">Inventory implication</text>
<text x="810" y="383" class="cue" fill="#9d174d">Completed purchase —</text>
<text x="810" y="400" class="cue" fill="#9d174d">stock increase, paid</text>
<rect x="805" y="410" width="215" height="22" rx="4" fill="#fce7f3"/>
<text x="912" y="425" text-anchor="middle" class="cue" fill="#831843">Hardest OCR target</text>

<!-- note -->
<rect x="30" y="470" width="1000" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="495" class="hd" fill="#334155">Why classification precedes extraction</text>
<text x="48" y="518" class="cue" fill="#475569">The same visual field carries a different meaning depending on document type. A quantity column on a delivery note records goods actually received;</text>
<text x="48" y="536" class="cue" fill="#475569">the same column on a purchase order records goods merely ordered. A customer copy may restate a transaction already captured from another document.</text>
<text x="48" y="554" class="cue" fill="#475569">A system that cannot distinguish these classes cannot decide what a document implies about stock — which is why document-type recognition is treated</text>
<text x="48" y="572" class="cue" fill="#475569">as a primary objective rather than as metadata, and why Chapter 4 reports a full confusion matrix rather than accuracy alone.</text>
</svg>
