<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Item-name standardization: suggest, verify, confirm once, remember</title>
<desc>An LLM standardization suggestion is checked against a confirmed-mapping cache. Cache hits auto-apply. New ambiguities go through a confidence check: high confidence becomes a one-tap human suggestion, low confidence goes to full human review. Either way a human confirms, edits, or rejects, the result is stored in the confirmed-mapping cache, and the standardized field is included in the JSON output.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
</marker>
</defs>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .title { font-size: 14.5px; font-weight: 700; }
  .sub { font-size: 11.5px; }
  .lbl { font-size: 11.5px; font-weight: 600; }
  .edge { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow3); }
</style>
<rect width="1000" height="620" fill="#ffffff"/>

<text x="500" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Item-Name Standardization: Suggest → Verify → Confirm Once → Remember</text>

<rect x="380" y="55" width="240" height="66" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="500" y="82" text-anchor="middle" class="title" fill="#4c1d95">LLM Suggestion</text>
<text x="500" y="102" text-anchor="middle" class="sub" fill="#5b21b6">e.g. "Coke" → "Coca-Cola"</text>

<polygon points="500,151 620,196 500,241 380,196" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="500" y="191" text-anchor="middle" class="title" fill="#7c2d12">Mapping already</text>
<text x="500" y="208" text-anchor="middle" class="title" fill="#7c2d12">confirmed before?</text>

<rect x="60" y="167" width="200" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="160" y="192" text-anchor="middle" class="title" fill="#14532d">Auto-Apply</text>
<text x="160" y="210" text-anchor="middle" class="sub" fill="#166534">no human prompt needed</text>

<polygon points="800,151 920,196 800,241 680,196" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="800" y="191" text-anchor="middle" class="title" fill="#7c2d12">Confidence</text>
<text x="800" y="208" text-anchor="middle" class="title" fill="#7c2d12">Check</text>

<rect x="700" y="290" width="200" height="62" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="800" y="314" text-anchor="middle" class="title" fill="#713f12">Suggest to Reviewer</text>
<text x="800" y="332" text-anchor="middle" class="sub" fill="#854d0e">one-tap confirmation</text>
<text x="800" y="346" text-anchor="middle" class="sub" fill="#854d0e">(high confidence)</text>

<rect x="480" y="290" width="200" height="62" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="580" y="314" text-anchor="middle" class="title" fill="#7f1d1d">Route to Full Review</text>
<text x="580" y="332" text-anchor="middle" class="sub" fill="#991b1b">(low confidence /</text>
<text x="580" y="346" text-anchor="middle" class="sub" fill="#991b1b">ambiguous)</text>

<rect x="580" y="392" width="240" height="62" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="700" y="418" text-anchor="middle" class="title" fill="#7f1d1d">Reviewer Confirms /</text>
<text x="700" y="436" text-anchor="middle" class="title" fill="#7f1d1d">Edits / Rejects</text>

<rect x="580" y="484" width="240" height="62" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="700" y="508" text-anchor="middle" class="title" fill="#4c1d95">Store in Confirmed-</text>
<text x="700" y="526" text-anchor="middle" class="title" fill="#4c1d95">Mapping Cache</text>

<rect x="60" y="484" width="240" height="66" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="180" y="510" text-anchor="middle" class="title" fill="#14532d">Standardized Field</text>
<text x="180" y="530" text-anchor="middle" class="sub" fill="#166534">included in JSON output</text>

<path class="edge" d="M500,121 L500,151"/>

<path class="edge" d="M380,196 L260,196"/>
<text x="320" y="180" text-anchor="middle" class="lbl" fill="#16a34a">yes — cache hit</text>

<path class="edge" d="M620,196 L680,196"/>
<text x="650" y="180" text-anchor="middle" class="lbl" fill="#ea580c">no — new</text>
<text x="650" y="193" text-anchor="middle" class="lbl" fill="#ea580c">ambiguity</text>

<path class="edge" d="M800,241 L800,290"/>
<text x="820" y="266" text-anchor="middle" class="lbl" fill="#ca8a04">high</text>

<path class="edge" d="M760,225 C650,250 620,260 600,290"/>
<text x="655" y="266" text-anchor="middle" class="lbl" fill="#dc2626">low / ambiguous</text>

<path class="edge" d="M800,352 C800,375 750,385 720,392"/>
<path class="edge" d="M580,352 C560,370 620,382 660,392"/>

<path class="edge" d="M700,454 L700,484"/>

<path class="edge" d="M580,515 C400,515 400,515 300,515"/>
<text x="440" y="500" text-anchor="middle" class="lbl" fill="#4c1d95">confirmed mapping</text>

<path class="edge" d="M160,225 L160,484"/>

</svg>
